# MCP Market - Main server
server {
    listen 80;
    server_name mcp-market.ru www.mcp-market.ru;

    # Redirect to HTTPS (Cloudflare handles SSL)
    # If using Cloudflare Flexible SSL, keep this as HTTP
    

    # Protected: tasks dashboard
    location /tasks {
        auth_basic "Private Area";
        auth_basic_user_file /opt/mcp-market/nginx/.htpasswd_tasks;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/tasks {
        auth_basic "Private Area";
        auth_basic_user_file /opt/mcp-market/nginx/.htpasswd_tasks;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE support (for MCP Streamable HTTP)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Redirect all other MCP domains to main
server {
    listen 80;
    server_name mcpstroy.ru www.mcpstroy.ru 
                mcpstroy.online www.mcpstroy.online
                mcpdom.ru www.mcpdom.ru 
                mcpdom.online www.mcpdom.online
                mcpbaza.ru www.mcpbaza.ru
                mcpkatalog.ru www.mcpkatalog.ru
                mcpindex.ru www.mcpindex.ru
                mcppages.ru www.mcppages.ru
                mcppages.com www.mcppages.com;

    return 301 https://mcp-market.ru$request_uri;
}
