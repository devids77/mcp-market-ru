function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function saveData(projects) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
  } catch(e) {}
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

let idCounter = Date.now();
function uid() { return 'id_' + (idCounter++); }

const statusMap = { todo: 'in_progress', in_progress: 'done', done: 'todo' };
const statusLabel = { todo: 'Запланировано', in_progress: 'В работе', done: 'Выполнено' };
const statusIcon = { todo: '○', in_progress: '◑', done: '●' };
const filterOptions = ['all', 'todo', 'in_progress', 'done'];
const filterLabels = { all: 'Все', todo: 'Запланировано', in_progress: 'В работе', done: 'Выполнено' };

function StatusCircle({ status, color, onClick }) {
  const colors = {
    todo: 'border-gray-600 text-gray-600',
    in_progress: `text-yellow-400`,
    done: ''
  };
  return (
    <button onClick={onClick} className="status-ring flex-shrink-0 w-6 h-6 flex items-center justify-center rounded-full" title={statusLabel[status]}>
      {status === 'todo' && <span className="w-5 h-5 rounded-full border-2 border-gray-600 block"></span>}
      {status === 'in_progress' && (
        <svg width="20" height="20" viewBox="0 0 20 20">
          <circle cx="10" cy="10" r="8" fill="none" stroke={color} strokeWidth="2" opacity="0.4"/>
          <path d="M10 2 A8 8 0 0 1 10 18" fill={color}/>
        </svg>
      )}
      {status === 'done' && <span className="w-5 h-5 rounded-full block" style={{background: color}}></span>}
    </button>
  );
}

function ProgressBar({ done, total, color }) {
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  return (
    <div className="flex items-center gap-2 mt-1">
      <div className="flex-1 h-1.5 bg-gray-800 rounded-full overflow-hidden">
        <div className="h-full rounded-full transition-all duration-500" style={{ width: pct + '%', background: color }}></div>
      </div>
      <span className="text-xs text-gray-500 w-8 text-right">{pct}%</span>
    </div>
  );
}

function StatCard({ label, value, accent }) {
  return (
    <div className="bg-gray-900 rounded-xl p-4 border border-gray-800">
      <div className="text-2xl font-bold" style={{ color: accent }}>{value}</div>
      <div className="text-xs text-gray-500 mt-1">{label}</div>
    </div>
  );
}

  const [projects, setProjects] = useState(() => loadData() || defaultProjects);
  const [selectedId, setSelectedId] = useState(projects[0]?.id);
  const [filter, setFilter] = useState('all');
  const [showAddTask, setShowAddTask] = useState(false);
  const [newTaskText, setNewTaskText] = useState('');
  const [showAddProject, setShowAddProject] = useState(false);
  const [newProjName, setNewProjName] = useState('');
  const [newProjEmoji, setNewProjEmoji] = useState('📁');
  const [newProjColor, setNewProjColor] = useState('#3B82F6');
  const [mobileShowTasks, setMobileShowTasks] = useState(false);
  const [search, setSearch] = useState('');

    let total = 0, done = 0, inProgress = 0, todo = 0;
    projects.forEach(p => p.tasks.forEach(t => {
      total++;
      if (t.status === 'done') done++;
      else if (t.status === 'in_progress') inProgress++;
      else todo++;
    }));
    return { total, done, inProgress, todo };
  }, [projects]);

  const recentDone = useMemo(() => {
    const all = [];
    projects.forEach(p => p.tasks.forEach(t => {
      if (t.status === 'done' && t.date) all.push({ ...t, projectName: p.emoji + ' ' + p.name, color: p.color });
    }));
    all.sort((a, b) => b.date.localeCompare(a.date));
    return all.slice(0, 7);
  }, [projects]);

  const selectedProject = projects.find(p => p.id === selectedId);

  const filteredTasks = useMemo(() => {
    if (!selectedProject) return [];
    let tasks = selectedProject.tasks;
    if (filter !== 'all') tasks = tasks.filter(t => t.status === filter);
    if (search.trim()) {
      const q = search.toLowerCase();
      tasks = tasks.filter(t => t.text.toLowerCase().includes(q));
    }
    return tasks;
  }, [selectedProject, filter, search]);

  const toggleStatus = useCallback((projectId, taskId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return { ...p, tasks: p.tasks.map(t => {
        if (t.id !== taskId) return t;
        const next = statusMap[t.status];
        return { ...t, status: next, date: next === 'done' ? todayStr() : (next === 'todo' ? null : t.date) };
      })};
    }));
  }, []);

  const addTask = () => {
    if (!newTaskText.trim() || !selectedId) return;
    setProjects(prev => prev.map(p => {
      if (p.id !== selectedId) return p;
      return { ...p, tasks: [...p.tasks, { id: uid(), text: newTaskText.trim(), status: 'todo', date: null }] };
    }));
    setNewTaskText('');
    setShowAddTask(false);
  };

  const addProject = () => {
    if (!newProjName.trim()) return;
    const np = { id: uid(), name: newProjName.trim(), emoji: newProjEmoji, color: newProjColor, tasks: [] };
    setProjects(prev => [...prev, np]);
    setSelectedId(np.id);
    setNewProjName('');
    setShowAddProject(false);
  };

  const deleteTask = (projectId, taskId) => {
    setProjects(prev => prev.map(p => {
      if (p.id !== projectId) return p;
      return { ...p, tasks: p.tasks.filter(t => t.id !== taskId) };
    }));
  };

  const selectProject = (id) => {
    setSelectedId(id);
    setFilter('all');
    setSearch('');
    setMobileShowTasks(true);
  };

  return (
    <div className="min-h-screen bg-gray-950">
      {/* Header */}
      <header className="border-b border-gray-800 bg-gray-950/80 backdrop-blur sticky top-0 z-30">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-3">
            {mobileShowTasks && (
              <button onClick={() => setMobileShowTasks(false)} className="md:hidden text-gray-400 hover:text-white mr-1">
                <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
              </button>
            )}

            <span className="hidden sm:inline">{stats.done}/{stats.total} выполнено</span>

          <StatCard label="В работе" value={stats.inProgress} accent="#F59E0B" />
          <StatCard label="Запланировано" value={stats.todo} accent="#6B7280" />

                <div className="p-3 border-b border-gray-800 bg-gray-900 fade-in">
                  <div className="flex gap-2 mb-2">
                    <input value={newProjEmoji} onChange={e => setNewProjEmoji(e.target.value)} className="w-10 bg-gray-800 border border-gray-700 rounded px-1 text-center text-sm" maxLength={2}/>
                    <input value={newProjName} onChange={e => setNewProjName(e.target.value)} placeholder="Название проекта" className="flex-1 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm text-white placeholder-gray-600 outline-none focus:border-gray-600" onKeyDown={e => e.key === 'Enter' && addProject()}/>
                  </div>
                  <div className="flex gap-2 items-center">
                    <input type="color" value={newProjColor} onChange={e => setNewProjColor(e.target.value)} className="w-6 h-6 rounded cursor-pointer border-0 bg-transparent"/>
                    <button onClick={addProject} className="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded">Добавить</button>
                  </div>
                </div>
              )}

              <div className="max-h-[50vh] md:max-h-[60vh] overflow-y-auto">
                {projects.map(p => {
                  const done = p.tasks.filter(t => t.status === 'done').length;
                  const total = p.tasks.length;
                  return (
                    <div key={p.id} onClick={() => selectProject(p.id)}
                      className={`project-item p-3 cursor-pointer border-l-2 ${selectedId === p.id ? 'bg-gray-800/50' : ''}`}
                      style={{ borderLeftColor: selectedId === p.id ? p.color : 'transparent' }}>
                      <div className="flex items-center gap-2">
                        <span className="text-base">{p.emoji}</span>
                        <span className="text-sm font-medium text-gray-200 truncate flex-1">{p.name}</span>
                        <span className="text-xs text-gray-500">{done}/{total}</span>
                      </div>
                      <ProgressBar done={done} total={total} color={p.color} />
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Recent done */}
            <div className="bg-gray-900 rounded-xl border border-gray-800 mt-4 overflow-hidden hidden md:block">
              <div className="p-3 border-b border-gray-800">
                <span className="text-sm font-medium text-gray-300">Последние выполненные</span>
              </div>
              <div className="max-h-64 overflow-y-auto">
                {recentDone.map(t => (
                  <div key={t.id} className="px-3 py-2 border-b border-gray-800/50 last:border-0">
                    <div className="text-xs text-gray-400 truncate">{t.text}</div>
                    <div className="flex items-center gap-2 mt-0.5">
                      <span className="text-[10px] text-gray-600">{t.date}</span>
                      <span className="text-[10px] truncate" style={{color: t.color}}>{t.projectName}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Right - Tasks */}
          <div className={`flex-1 min-w-0 ${!mobileShowTasks ? 'hidden md:block' : 'block'}`}>
            {selectedProject ? (
              <div className="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
                {/* Project header */}
                <div className="p-4 border-b border-gray-800">
                  <div className="flex items-center gap-3 mb-3">
                    <span className="text-2xl">{selectedProject.emoji}</span>
                    <h2 className="text-lg font-semibold text-white">{selectedProject.name}</h2>
                    <span className="ml-auto text-xs px-2 py-0.5 rounded-full" style={{background: selectedProject.color + '22', color: selectedProject.color}}>
                      {selectedProject.tasks.filter(t=>t.status==='done').length}/{selectedProject.tasks.length}
                    </span>
                  </div>
                  <div className="flex flex-wrap gap-2 items-center">
                    {filterOptions.map(f => (
                      <button key={f} onClick={() => setFilter(f)}
                        className={`text-xs px-3 py-1 rounded-full transition ${filter === f ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300'}`}>
                        {filterLabels[f]}
                        {f !== 'all' && <span className="ml-1 opacity-60">
                          {selectedProject.tasks.filter(t => t.status === f).length}
                        </span>}
                      </button>
                    ))}
                    <div className="flex-1"></div>
                    <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Поиск..." className="bg-gray-800 border border-gray-700 rounded-lg px-2 py-1 text-xs text-white placeholder-gray-600 outline-none w-32 focus:w-40 transition-all"/>
                  </div>
                </div>

                {/* Tasks list */}
                <div className="max-h-[60vh] overflow-y-auto">
                  {filteredTasks.map(t => (
                    <div key={t.id} className="task-row flex items-center gap-3 px-4 py-2.5 border-b border-gray-800/50 last:border-0">
                      <StatusCircle status={t.status} color={selectedProject.color} onClick={() => toggleStatus(selectedProject.id, t.id)} />
                      <span className={`text-sm flex-1 ${t.status === 'done' ? 'text-gray-500 line-through' : 'text-gray-200'}`}>
                        {t.text}
                      </span>
                      {t.date && <span className="text-[10px] text-gray-600 flex-shrink-0">{t.date}</span>}
                      <button onClick={() => deleteTask(selectedProject.id, t.id)} className="text-gray-700 hover:text-red-400 text-xs flex-shrink-0 opacity-0 group-hover:opacity-100" style={{opacity: undefined}} title="Удалить">✕</button>
                    </div>
                  ))}
                  {filteredTasks.length === 0 && (
                    <div className="p-8 text-center text-gray-600 text-sm">Нет задач</div>
                  )}
                </div>

                {/* Add task */}
                <div className="p-3 border-t border-gray-800">
                  {showAddTask ? (
                    <div className="flex gap-2 fade-in">
                      <input value={newTaskText} onChange={e => setNewTaskText(e.target.value)} placeholder="Описание задачи..."
                        className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-600 outline-none focus:border-gray-600"
                        onKeyDown={e => e.key === 'Enter' && addTask()} autoFocus />
                      <button onClick={addTask} className="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg">+</button>
                      <button onClick={() => { setShowAddTask(false); setNewTaskText(''); }} className="text-gray-500 hover:text-white text-sm px-2">✕</button>
                    </div>
                  ) : (
                    <button onClick={() => setShowAddTask(true)} className="text-sm text-gray-500 hover:text-white flex items-center gap-2 w-full py-1">
                      <span className="text-lg">+</span> Добавить задачу
                    </button>
                  )}
                </div>
              </div>
            ) : (
              <div className="bg-gray-900 rounded-xl border border-gray-800 p-8 text-center text-gray-600">
                Выберите проект
              </div>
            )}

            {/* Mobile recent done */}
            <div className="bg-gray-900 rounded-xl border border-gray-800 mt-4 overflow-hidden md:hidden">
              <div className="p-3 border-b border-gray-800">
                <span className="text-sm font-medium text-gray-300">Последние выполненные</span>
              </div>
              <div className="max-h-48 overflow-y-auto">
                {recentDone.slice(0, 5).map(t => (
                  <div key={t.id} className="px-3 py-2 border-b border-gray-800/50 last:border-0">
                    <div className="text-xs text-gray-400 truncate">{t.text}</div>
                    <div className="flex items-center gap-2 mt-0.5">
                      <span className="text-[10px] text-gray-600">{t.date}</span>
                      <span className="text-[10px] truncate" style={{color: t.color}}>{t.projectName}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
